services:
  docs:
    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    env_file: .env
    volumes:
      - .:/workspace:ro
      - ./.opencode:/workspace/.opencode:rw
      - ./README.md:/workspace/README.md:rw
      - ./doc:/workspace/doc:rw
      - ./src:/workspace/src:rw
      - ./scripts:/workspace/scripts:rw
      - ./output:/workspace/output:rw
    working_dir: /workspace
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]