services:
  docs:
    build:
      context: .
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    env_file: .env
    volumes:
      - ./.opencode:/workspace/.opencode:rw
      - ./config:/workspace/config:ro
      - ./doc:/workspace/doc:rw
      - ./scripts:/workspace/scripts:rw
      - ./src:/workspace/src:rw
      - ./output:/workspace/output:rw
      - ./opencode.json:/workspace/opencode.json:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./README.md:/workspace/README.md:rw
      - ./run_all_agents.py:/workspace/run_all_agents.py:ro
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]