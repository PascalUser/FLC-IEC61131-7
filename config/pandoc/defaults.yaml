# Usage:  pandoc thesis.md -d defaults.yaml
# (produces Thesis.docx in the same folder)

from: markdown+smart
to: docx
output-file: Thesis.docx
reference-doc: reference.docx    # styles: generated by build_reference.py
number-sections: true            # 1, 1.1, 1.1.1 ...
highlight-style: tango           # code colors (try: pygments, kate, zenburn)
# Don't use `toc: true` here: the filter builds the title page + contents on its own page.

filters:
  - thesis.lua                   # image sizing, title page and contents
  - citeproc                     # citations and bibliography (uses bibliography: from the .md YAML)
